</style></head><body><noscript>Pracownia Tortów wymaga włączonego JavaScript. Dane i obliczenia działają w Twojej przeglądarce.</noscript><div id="app"></div><dialog id="editor"></dialog><dialog id="sales-editor"></dialog><dialog id="photo-dialog"></dialog><div id="toast" role="status" aria-live="polite"></div><input type="file" id="import-file" accept="application/json,.json" hidden><script type="module">/* Pracownia Tortów — pure calculation engine, all money in PLN. */
const UNITS={g:{dimension:'mass',factor:1,base:'g'},kg:{dimension:'mass',factor:1000,base:'g'},ml:{dimension:'volume',factor:1,base:'ml'},l:{dimension:'volume',factor:1000,base:'ml'},szt:{dimension:'count',factor:1,base:'szt'}};
const MODES={volume:'Objętość — biszkopt',filling:'Powierzchnia × przełożenia',coating:'Wierzch + boki — tynk',area:'Powierzchnia — pojedyncza warstwa',perimeter:'Obwód — dekoracja brzegu',fixed:'Stała ilość na piętro'};
function finite(n,label,min=0,max=1e9){if(typeof n!=='number'||!Number.isFinite(n)||n<min||n>max)throw Error(`${label}: podaj liczbę od ${min} do ${max}.`);return n;}
function geometry(p){if(!p||!['round','rect'].includes(p.shape))throw Error('Nieznany kształt formy.');finite(p.height,'Wysokość',0.1,200);finite(p.layers,'Liczba przełożeń',1,30);if(!Number.isInteger(p.layers))throw Error('Liczba przełożeń musi być całkowita.');let area,perimeter;if(p.shape==='round'){finite(p.diameter,'Średnica',1,200);area=Math.PI*(p.diameter/2)**2;perimeter=Math.PI*p.diameter;}else{finite(p.width,'Szerokość',1,200);finite(p.length,'Długość',1,200);area=p.width*p.length;perimeter=2*(p.width+p.length);}return {area,perimeter,volume:area*p.height,coating:area+perimeter*p.height};}
function scale(mode,base,target){const b=geometry(base),t=geometry(target);switch(mode){case 'volume':return t.volume/b.volume;case 'filling':return t.area/b.area*target.layers/base.layers;case 'coating':return t.coating/b.coating;case 'area':return t.area/b.area;case 'perimeter':return t.perimeter/b.perimeter;case 'fixed':return 1;default:throw Error('Nieznany sposób skalowania.');}}
function convert(q,from,to){finite(q,'Ilość');if(!UNITS[from]||!UNITS[to]||UNITS[from].dimension!==UNITS[to].dimension)throw Error('Niezgodne jednostki. Nie przeliczamy gramów na mililitry bez gęstości.');return q*UNITS[from].factor/UNITS[to].factor;}
function validateIngredient(i){if(!i||typeof i.id!=='string'||!i.id||typeof i.name!=='string'||!i.name.trim())throw Error('Składnik musi mieć nazwę i identyfikator.');if(!UNITS[i.unit])throw Error('Nieznana jednostka składnika.');finite(i.pack,'Wielkość opakowania',0.001);finite(i.price,'Cena opakowania');finite(i.loss,'Strata składnika',0,95);finite(i.stock,'Zapas');if(i.unit==='szt'&&(!Number.isInteger(i.pack)||!Number.isInteger(i.stock)))throw Error('Składniki liczone w sztukach muszą mieć całkowitą wielkość opakowania i stan magazynu.');if(typeof i.allergens!=='string'||typeof i.supplier!=='string')throw Error('Nieprawidłowy opis składnika.');return i;}
function validateRecipe(r,ingredients){if(!r||typeof r.id!=='string'||!r.id||typeof r.name!=='string'||!r.name.trim()||typeof r.notes!=='string')throw Error('Receptura musi mieć nazwę.');geometry(r.base);if(!Array.isArray(r.rows)||!r.rows.length||r.rows.length>300)throw Error('Receptura musi zawierać od 1 do 300 pozycji.');r.rows.forEach(x=>{const i=ingredients.find(i=>i.id===x.ingredientId);if(!i)throw Error('Receptura odwołuje się do nieistniejącego składnika.');finite(x.qty,'Ilość w recepturze',0.001);if(x.unit==='szt'&&!Number.isInteger(x.qty))throw Error('Ilość składnika w sztukach musi być liczbą całkowitą.');convert(x.qty,x.unit,UNITS[i.unit].base);if(!MODES[x.mode])throw Error('Nieprawidłowy sposób skalowania.');if(typeof x.group!=='string')throw Error('Nieprawidłowa sekcja receptury.');});return r;}
function validateOrder(o,recipes){if(!o||typeof o.name!=='string')throw Error('Nieprawidłowe dane kalkulacji.');if(!Array.isArray(o.tiers)||o.tiers.length<1||o.tiers.length>20)throw Error('Wymagane 1–20 pięter.');o.tiers.forEach(t=>{if(!recipes.some(r=>r.id===t.recipeId))throw Error('Brakuje receptury piętra.');geometry(t);});for(const k of ['reserve','hours','rate','packaging','decoration','delivery','energyKwh','energyPrice','overhead','margin','roundTo','portionVolume'])finite(o[k],k);finite(o.reserve,'Zapas technologiczny',0,100);finite(o.margin,'Marża',0,95);finite(o.roundTo,'Zaokrąglenie',0.01,1000);finite(o.portionVolume,'Objętość porcji',10,2000);finite(o.count,'Liczba tortów',1,1000);if(!Number.isInteger(o.count))throw Error('Liczba tortów musi być całkowita.');if(o.sale!==null)finite(o.sale,'Cena sprzedaży');return o;}
function calculate(ingredients,recipes,order){ingredients.forEach(validateIngredient);recipes.forEach(r=>validateRecipe(r,ingredients));validateOrder(order,recipes);const rows=[],used=new Map(),allergens=new Set();let volume=0;const tiers=order.tiers.map((t,index)=>{const recipe=recipes.find(r=>r.id===t.recipeId);volume+=geometry(t).volume;for(const x of recipe.rows){const i=ingredients.find(i=>i.id===x.ingredientId),unit=UNITS[i.unit].base,factor=scale(x.mode,recipe.base,t),reserve=(x.mode==='fixed'||unit==='szt')?1:1+order.reserve/100,rawNet=convert(x.qty,x.unit,unit)*factor*reserve*order.count,net=unit==='szt'?Math.ceil(rawNet-1e-12):rawNet,rawGross=net/(1-i.loss/100),gross=unit==='szt'?Math.ceil(rawGross-1e-12):rawGross,packBase=i.pack*UNITS[i.unit].factor,cost=gross/packBase*i.price;rows.push({...x,tier:index+1,name:i.name,unit,factor,net,gross,cost});let sum=used.get(i.id);if(!sum){sum={id:i.id,name:i.name,unit,net:0,gross:0,cost:0,packBase,packPrice:i.price,stock:i.stock*UNITS[i.unit].factor};used.set(i.id,sum);}sum.net+=net;sum.gross+=gross;sum.cost+=cost;if(i.allergens.trim())allergens.add(i.allergens.trim());}return {recipe:recipe.name,volumeFactor:scale('volume',recipe.base,t),portionEstimate:Math.max(1,Math.floor(geometry(t).volume/order.portionVolume))};});const shopping=[...used.values()].map(x=>{const missing=Math.max(0,x.gross-x.stock),packs=missing?Math.ceil(missing/x.packBase-1e-12):0;return {...x,missing,packs,buyCost:packs*x.packPrice,leftover:x.stock+packs*x.packBase-x.gross};});const ingredientsCost=rows.reduce((s,r)=>s+r.cost,0),n=order.count,costs={ingredients:ingredientsCost,labor:order.hours*order.rate*n,packaging:order.packaging*n,decoration:order.decoration*n,energy:order.energyKwh*order.energyPrice*n,overhead:order.overhead*n,delivery:order.delivery};const total=Object.values(costs).reduce((s,v)=>s+v,0),suggested=Math.ceil((total/(1-order.margin/100))/order.roundTo-1e-12)*order.roundTo,sale=order.sale??suggested,profit=sale-total,actualMargin=sale?profit/sale*100:null,portions=tiers.reduce((s,t)=>s+t.portionEstimate,0)*n;return {rows,shopping,tiers,costs,total,suggested,sale,profit,actualMargin,portions,perPortion:sale/portions,perCake:sale/n,volume:volume*n,allergens:[...allergens],shoppingCost:shopping.reduce((s,x)=>s+x.buyCost,0)};}
function validateState(s){if(!s||s.version!==1)throw Error('Nieobsługiwana wersja kopii.');if(!Array.isArray(s.ingredients)||s.ingredients.length>1000||!Array.isArray(s.recipes)||s.recipes.length>300||!Array.isArray(s.quotes)||s.quotes.length>500)throw Error('Nieprawidłowa lub zbyt duża baza.');for(const list of [s.ingredients,s.recipes,s.quotes])if(new Set(list.map(x=>x.id)).size!==list.length)throw Error('Powtórzone identyfikatory.');validateSales(s.sales??[]);s.ingredients.forEach(validateIngredient);s.recipes.forEach(r=>validateRecipe(r,s.ingredients));validateOrder(s.order,s.recipes);for(const q of s.quotes){if(typeof q.id!=='string'||typeof q.name!=='string'||typeof q.date!=='string'||!q.snapshot)throw Error('Nieprawidłowa zapisana wycena.');if(q.snapshot.quotes?.length||q.snapshot.sales?.length)throw Error('Kopia wyceny nie może zawierać kolejnych wycen.');validateState({...q.snapshot,quotes:[],sales:[]});}return s;}

const SALE_STATUSES={inquiry:'Zapytanie',confirmed:'Potwierdzone',production:'W przygotowaniu',ready:'Gotowe',delivered:'Wydane',cancelled:'Anulowane'};
function saleBalance(s){const paid=Math.round((s.deposit+s.paid)*100)/100,balance=Math.round((s.price-paid)*100)/100;return {paid,balance,due:Math.max(0,balance),overpayment:Math.max(0,-balance)};}
function validateSale(s){
  const text=(key,max,required=false)=>{if(typeof s[key]!=='string'||s[key].length>max||(required&&!s[key].trim()))throw Error('Zamówienie: nieprawidłowe pole '+key+'.');};
  if(!s||typeof s!=='object')throw Error('Nieprawidłowe zamówienie.');
  for(const k of ['id','number','title','customer'])text(k,160,true);
  for(const k of ['phone','email','occasion','flavor','inscription','colors'])text(k,300);
  for(const k of ['description','notes','allergies'])text(k,12000);
  text('address',1000);text('dueDate',10);text('dueTime',5);
  if(!Object.hasOwn(SALE_STATUSES,s.status)||!['pickup','delivery'].includes(s.fulfillment))throw Error('Nieprawidłowy status lub sposób odbioru.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s.dueDate)||!Number.isFinite(Date.parse(s.dueDate+'T12:00:00Z'))||new Date(s.dueDate+'T12:00:00Z').toISOString().slice(0,10)!==s.dueDate)throw Error('Wpisz prawidłowy termin odbioru.');
  if(s.dueTime&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(s.dueTime))throw Error('Nieprawidłowa godzina.');
  for(const key of ['createdAt','updatedAt'])if(typeof s[key]!=='string'||!Number.isFinite(Date.parse(s[key])))throw Error('Nieprawidłowa data zapisu.');
  for(const key of ['price','deposit','paid']){finite(s[key],key);if(Math.abs(s[key]*100-Math.round(s[key]*100))>1e-5)throw Error('Kwoty podaj z dokładnością do groszy.');}
  finite(s.portions,'Liczba porcji',1,10000);if(!Number.isInteger(s.portions))throw Error('Podaj całkowitą liczbę porcji.');
  if(!Array.isArray(s.photos)||s.photos.length>8)throw Error('Zamówienie może mieć do 8 zdjęć.');
  const ids=new Set();for(const p of s.photos){if(!p||typeof p.id!=='string'||!p.id||ids.has(p.id)||typeof p.name!=='string'||p.name.length>200||typeof p.caption!=='string'||p.caption.length>500||typeof p.data!=='string'||p.data.length>450000||!/^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$/.test(p.data))throw Error('Nieprawidłowe zdjęcie zamówienia.');ids.add(p.id);}
  if(s.quote!==null){if(!s.quote||typeof s.quote.name!=='string'||typeof s.quote.date!=='string'||!s.quote.snapshot)throw Error('Nieprawidłowe powiązanie wyceny.');const snap=s.quote.snapshot;if(snap.sales?.length||snap.quotes?.length)throw Error('Wycena zamówienia nie może zawierać archiwum ani zamówień.');validateState({...snap,sales:[],quotes:[]});}
  return s;
}
function validateSales(sales){if(!Array.isArray(sales)||sales.length>1000)throw Error('Baza może zawierać do 1000 zamówień.');const ids=new Set(),numbers=new Set();let bytes=0;for(const s of sales){validateSale(s);if(ids.has(s.id)||numbers.has(s.number))throw Error('Powtórzony numer lub identyfikator zamówienia.');ids.add(s.id);numbers.add(s.number);bytes+=s.photos.reduce((n,p)=>n+p.data.length,0);}if(bytes>60*1024*1024)throw Error('Zdjęcia przekraczają limit 60 MB tej bazy. Zarchiwizuj kopię i usuń niepotrzebne zdjęcia.');return sales;}

// Converts only the untouched demonstration egg entry from releases <= 1.1.
// User-created and edited ingredients are never guessed or converted.
function migrateState(state){
  let changed=false;
  if(!Array.isArray(state.sales)){state.sales=[];changed=true;}
  const egg=state.ingredients?.find(i=>i.id==='egg');
  const eggRows=(state.recipes??[]).flatMap(r=>r.rows??[]).filter(r=>r.ingredientId==='egg');
  const untouched=egg&&egg.name==='Jaja — masa bez skorupki'&&egg.pack===500&&egg.unit==='g'&&egg.price===12.5&&egg.loss===0&&egg.stock===0&&eggRows.length>0&&eggRows.every(r=>r.qty===300&&r.unit==='g');
  if(untouched){egg.name='Jaja';egg.pack=10;egg.unit='szt';for(const row of eggRows){row.qty=6;row.unit='szt';}changed=true;}
  return {state,changed};
}

// Transactional, device-local storage. No uploads to GitHub or external services.
class WorkshopStorage {
  constructor(factory=globalThis.indexedDB){this.factory=factory;this.db=null;this.revision=0;this.queue=Promise.resolve();this.lastRaw=null;}
  async open(){if(this.db)return;if(!this.factory)throw Error('Ta przeglądarka nie udostępnia bazy danych. Otwórz aplikację pod adresem HTTPS.');this.db=await new Promise((resolve,reject)=>{const request=this.factory.open('pracownia-tortow',1);request.onupgradeneeded=()=>request.result.createObjectStore('workshop');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);request.onblocked=()=>reject(Error('Zamknij inne karty pracowni i spróbuj ponownie.'));});this.db.onversionchange=()=>{this.db.close();this.db=null;};}
  async load(){await this.open();const entry=await new Promise((resolve,reject)=>{const tx=this.db.transaction('workshop','readonly'),request=tx.objectStore('workshop').get('state');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});this.revision=entry?.revision??0;this.lastRaw=entry?.data??null;return this.lastRaw;}
  save(data){const copy=structuredClone(data);const task=this.queue.then(async()=>{await this.open();return new Promise((resolve,reject)=>{const tx=this.db.transaction('workshop','readwrite'),store=tx.objectStore('workshop');let next,error;const read=store.get('state');read.onsuccess=()=>{if((read.result?.revision??0)!==this.revision){error=Error('Dane zmieniły się w innej karcie. Pobierz kopię swojej pracy i odśwież stronę.');tx.abort();return;}next=this.revision+1;store.put({revision:next,data:copy},'state');};tx.oncomplete=()=>{this.revision=next;this.lastRaw=copy;resolve(next);};tx.onabort=()=>reject(error||tx.error||Error('Zapis nie powiódł się. Sprawdź wolne miejsce i pobierz kopię JSON.'));tx.onerror=()=>{};});});this.queue=task.catch(()=>{});return task;}
}

nta','allergies',s.allergies,'placeholder="Wpisz ustalenia i kwestie wymagające potwierdzenia."')}</div><h3 class="spaced">Zdjęcia poglądowe</h3><p class="help">Do 8 zdjęć JPEG, PNG lub WebP, maks. 15 MB każde przed zmniejszeniem. Aplikacja zapisuje pomniejszone kopie bez metadanych. Przy zdjęciu opisz, które elementy mają być wykorzystane.</p><label class="photo-upload">+ Wybierz zdjęcia z telefonu lub komputera<input id="sales-photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="sales-photo-grid" class="spaced">${photoGrid(s.photos,true)}</div><h3 class="spaced">Powiązana kalkulacja</h3><div id="sales-quote-summary" class="spaced">${quoteSummary(s.quote)}</div><div class="actions spaced"><label class="quote-choice">Źródło wyceny<select id="sales-quote-choice">${options([['current','Bieżący kalkulator'],...state().quotes.map(q=>[q.id,q.name+' · '+new Date(q.date).toLocaleDateString('pl-PL')])],'current')}</select></label><button type="button" data-sales="attach">Podłącz i pobierz cenę oraz porcje</button><button type="button" data-sales="detach">Odłącz</button></div><h3 class="spaced">Wpłaty i notatki</h3><div class="fields two spaced">${field('Otrzymana zaliczka · zł','deposit',s.deposit,'number','min="0" step="0.01" required')}${field('Pozostałe otrzymane wpłaty · zł','paid',s.paid,'number','min="0" step="0.01" required')}${area('Notatki wewnętrzne','notes',s.notes,'placeholder="Zakupy, kontakt z klientem, uwagi do produkcji…"')}</div><p id="sales-balance" class="note spaced">${balanceText(s)}</p><p class="help">Wpłaty to wartości faktycznie otrzymane. Nie wpisuj zaliczki ponownie w pozostałych wpłatach.</p></div><footer><button type="button" data-sales="close">Anuluj</button><button type="submit" class="primary" id="sales-save">Zapisz zamówienie</button></footer></form>`;}

  function readForm(){if(!edit||!dialog.querySelector('#sales-form'))return;for(const key of ['title','customer','phone','email','dueDate','dueTime','status','fulfillment','address','occasion','flavor','inscription','colors','description','allergies','notes'])edit[key]=dialog.querySelector(`[name="${key}"]`).value;for(const key of ['price','deposit','paid','portions'])edit[key]=Number(dialog.querySelector(`[name="${key}"]`).value);edit.photos.forEach((p,i)=>{const el=dialog.querySelector(`[data-photo-caption="${i}"]`);if(el)p.caption=el.value;});}

  function detail(s){edit=clone(s);const b=saleBalance(s);dialog.innerHTML=`<div class="cardheader"><div><span class="muted">${esc(s.number)} · ${SALE_STATUSES[s.status]}</span><h2>${esc(s.title)}</h2></div><button class="icon" data-sales="close" aria-label="Zamknij">×</button></div><div class="body"><div class="sales-detail-grid"><div><h3>${esc(s.customer)}</h3><p>${esc(s.phone)}${s.email?'<br>'+esc(s.email):''}</p></div><div><h3>${dateText(s)}</h3><p>${s.fulfillment==='delivery'?'Dostawa':'Odbiór osobisty'}<br>${esc(s.address)||'Miejsce do ustalenia'}</p></div></div><div class="note"><strong>Cena: ${money(s.price)}</strong><br>Zaliczka: ${money(s.deposit)} · inne wpłaty: ${money(s.paid)}<br>${balanceText(s)}</div><h3 class="spaced">Specyfikacja · ${s.portions} porcji</h3><p>Okazja: ${esc(s.occasion)||'—'}<br>Smak: ${esc(s.flavor)||'—'}<br>Kolory: ${esc(s.colors)||'—'}<br>Napis: <strong>${esc(s.inscription)||'—'}</strong></p><p class="prewrap">${esc(s.description)||'Brak opisu.'}</p><h3>Alergie i wymagania klienta</h3><p class="prewrap">${esc(s.allergies)||'Nie wpisano — do potwierdzenia z klientem.'}</p><h3>Inspiracje i zdjęcia</h3>${photoGrid(s.photos)}<h3 class="spaced">Powiązana wycena</h3>${quoteSummary(s.quote)}<h3 class="spaced">Notatki wewnętrzne</h3><p class="prewrap">${esc(s.notes)||'Brak notatek.'}</p><p class="help">Dodano ${new Date(s.createdAt).toLocaleString('pl-PL')} · zmieniono ${new Date(s.updatedAt).toLocaleString('pl-PL')}</p></div><footer class="sales-detail-actions"><button data-sales="delete" class="danger">Usuń</button><button data-sales="print">Drukuj kartę zamówienia</button>${s.quote?'<button data-sales="production">Karta produkcji</button>':''}<button class="primary" data-sales="edit">Edytuj</button></footer>`;if(!dialog.open)dialog.showModal();}

  async function compress(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Wybierz JPEG, PNG lub WebP. Zdjęcie HEIC najpierw zapisz jako JPEG.');if(file.size>15*1024*1024)throw Error('Zdjęcie przekracza 15 MB.');const url=URL.createObjectURL(file);try{const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error('Nie udało się odczytać zdjęcia.'));i.src=url;});if(img.naturalWidth*img.naturalHeight>50000000)throw Error('Zdjęcie ma ponad 50 megapikseli. Wybierz mniejszą kopię.');const canvas=document.createElement('canvas');let data;for(const [edge,quality] of [[1400,.82],[1400,.65],[1100,.65],[900,.55]]){const factor=Math.min(1,edge/Math.max(img.naturalWidth,img.naturalHeight));canvas.width=Math.max(1,Math.round(img.naturalWidth*factor));canvas.height=Math.max(1,Math.round(img.naturalHeight*factor));const ctx=canvas.getContext('2d');if(!ctx)throw Error('Przeglądarka nie może przygotować zdjęcia.');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);data=canvas.toDataURL('image/jpeg',quality);if(data.length<=450000)break;}if(!data||data.length>450000)throw Error('Nie udało się dostatecznie zmniejszyć zdjęcia.');return {id:uid(),name:file.name.slice(0,200),caption:'',data};}finally{URL.revokeObjectURL(url);}}
  async function upload(files){if(!edit)return;readForm();const owner=edit;busy=true;setBusy(true);const failures=[];try{for(const file of files){if(edit!==owner)break;if(owner.photos.length>=8){failures.push('Limit 8 zdjęć.');break;}try{const photo=await compress(file);if(edit===owner)owner.photos.push(photo);}catch(e){failures.push(file.name+': '+e.message);}}if(edit===owner){dialog.querySelector('#sales-photo-grid').innerHTML=photoGrid(owner.photos,true);if(failures.length)showError(failures.join(' '));else toast('Dodano zdjęcia. Zapisz zamówienie, aby je zachować.');}}finally{busy=false;setBusy(false);}}
  function setBusy(value){dialog.querySelectorAll('button,input,select,textarea').forEach(b=>b.disabled=value);const btn=dialog.querySelector('#sales-save');if(btn)btn.textContent=value?'Przetwarzanie…':'Zapisz zamówienie';}

  async function save(){if(busy||!edit)return;readForm();try{const item=clone(edit);for(const k of ['title','customer'])item[k]=item[k].trim();item.updatedAt=new Date().toISOString();validateSale(item);const next=clone(state());next.sales=next.sales??[];const at=next.sales.findIndex(s=>s.id===item.id);if(at<0)next.sales.push(item);else next.sales[at]=item;busy=true;setBusy(true);await api.commit(next);dialog.close();edit=null;toast('Zapisano zamówienie i zdjęcia.');}catch(e){showError(e.message);}finally{busy=false;setBusy(false);}}
  function printSale(s){const html=`<h1>Karta zamówienia · ${esc(s.number)}</h1><h2>${esc(s.title)}</h2><p><strong>${esc(s.customer)}</strong> · ${esc(s.phone)} · ${esc(s.email)}<br>Termin: <strong>${dateText(s)}</strong> · ${s.fulfillment==='delivery'?'Dostawa':'Odbiór osobisty'}<br>${esc(s.address)}</p><p>Status: ${SALE_STATUSES[s.status]} · ${s.portions} porcji<br>Smak: ${esc(s.flavor)}<br>Kolory: ${esc(s.colors)}<br>Napis na torcie: <strong>${esc(s.inscription)}</strong></p><h2>Ustalenia</h2><p class="prewrap">${esc(s.description)}</p><h2>Alergie i wymagania zgłoszone przez klienta</h2><p class="prewrap">${esc(s.allergies)||'Nie wpisano — wymagają potwierdzenia.'}</p><h2>Rozliczenie</h2><p>Cena: ${money(s.price)} · zaliczka: ${money(s.deposit)} · inne wpłaty: ${money(s.paid)}<br>${balanceText(s)}</p><h2>Zdjęcia poglądowe</h2><div class="print-photos">${s.photos.map(p=>`<figure><img src="${p.data}" alt="${esc(p.caption||p.name)}"><figcaption>${esc(p.caption||p.name)}</figcaption></figure>`).join('')}</div><h2>Notatki wewnętrzne</h2><p class="prewrap">${esc(s.notes)}</p><p>Karta robocza pracowni. Nie jest fakturą ani potwierdzeniem bankowym.</p>`;document.querySelector('#print-content').innerHTML=html;dialog.close();Promise.all([...document.querySelector('#print-content').querySelectorAll('img')].map(i=>i.decode().catch(()=>{}))).then(()=>window.print());}
  function exportList(){const safe=x=>{let s=String(x);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const rows=[['Numer','Zamówienie','Klient','Telefon','E-mail','Termin','Godzina','Status','Odbiór','Adres','Porcje','Smak','Cena PLN','Zaliczka PLN','Inne wpłaty PLN','Do zapłaty PLN','Nadpłata PLN','Opis'],...filtered().map(s=>[s.number,s.title,s.customer,s.phone,s.email,s.dueDate,s.dueTime,SALE_STATUSES[s.status],s.fulfillment==='delivery'?'Dostawa':'Odbiór osobisty',s.address,s.portions,s.flavor,s.price.toFixed(2),s.deposit.toFixed(2),s.paid.toFixed(2),saleBalance(s).due.toFixed(2),saleBalance(s).overpayment.toFixed(2),s.description])];api.download('zamowienia.csv','\uFEFF'+rows.map(r=>r.map(safe).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
  async function handle(b){const {action,id}=b.dataset;switch(action){case 'sales-new':open();break;case 'sales-from-calculator':open(null,true);break;case 'sales-edit':open(id);break;case 'sales-detail':detail(sales().find(s=>s.id===id));break;case 'sales-photo':zoom(sales().find(s=>s.id===id).photos,Number(b.dataset.photo));break;case 'sales-csv':exportList();break;case 'sales-clear':filter='active';query='';dateFrom='';dateTo='';api.render();break;}}
  dialog.addEventListener('submit',e=>{e.preventDefault();save();});

  dialog.addEventListener('click',async e=>{const b=e.target.closest('[data-sales]');if(!b||busy)return;const action=b.dataset.sales;try{if(action==='close'){close();return;}if(action==='edit'){open(edit.id);return;}if(action==='zoom'){readForm();zoom(edit.photos,Number(b.dataset.photo));return;}if(action==='remove-photo'){readForm();edit.photos.splice(Number(b.dataset.photo),1);dialog.querySelector('#sales-photo-grid').innerHTML=photoGrid(edit.photos,true);return;}if(action==='attach'){readForm();const choice=dialog.querySelector('#sales-quote-choice').value,s=state();const q=choice==='current'?{name:s.order.name,date:new Date().toISOString(),snapshot:clone({...s,sales:[],quotes:[]})}:clone(s.quotes.find(q=>q.id===choice));const r=calculate(q.snapshot.ingredients,q.snapshot.recipes,q.snapshot.order);edit.quote={name:q.name,date:q.date,snapshot:{...q.snapshot,sales:[],quotes:[]}};edit.price=Math.round(r.sale*100)/100;edit.portions=r.portions;dialog.querySelector('[name="price"]').value=edit.price;dialog.querySelector('[name="portions"]').value=edit.portions;dialog.querySelector('#sales-quote-summary').innerHTML=quoteSummary(edit.quote);dialog.querySelector('#sales-balance').textContent=balanceText(edit);return;}if(action==='detach'){readForm();edit.quote=null;dialog.querySelector('#sales-quote-summary').innerHTML=quoteSummary(null);return;}if(action==='production'){dialog.close();api.printProduction(edit.quote.snapshot);return;}if(action==='print'){printSale(edit);return;}if(action==='delete'){if(!window.confirm('Usunąć zamówienie '+edit.number+' wraz ze zdjęciami? Można je odzyskać tylko z wcześniej pobranej kopii JSON.'))return;busy=true;setBusy(true);const next=clone(state());next.sales=next.sales.filter(s=>s.id!==edit.id);await api.commit(next);dialog.close();edit=null;toast('Usunięto zamówienie.');}}catch(e){showError(e.message);}finally{busy=false;setBusy(false);}});
  document.querySelector('#app').addEventListener('input',e=>{if(e.target.id==='sales-search'){query=e.target.value;const pos=e.target.selectionStart;api.render();const input=document.querySelector('#sales-search');input.focus();input.setSelectionRange(pos,pos);}});
  document.querySelector('#app').addEventListener('change',e=>{if(e.target.id==='sales-status')filter=e.target.value;else if(e.target.id==='sales-from')dateFrom=e.target.value;else if(e.target.id==='sales-to')dateTo=e.target.value;else return;api.render();});
  return {render,handle,open,detail,fresh,filtered};
}

const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function geometryFields(p,scope,idx){return `${select('Kształt','shape',p.shape,[['round','Okrągły'],['rect','Prostokątny / kwadratowy']],scope,idx)}${p.shape==='round'?numeric('Średnica · cm','diameter',p.diameter,{min:1,max:200,scope,idx}):numeric('Szerokość · cm','width',p.width,{min:1,max:200,scope,idx})+numeric('Długość · cm','length',p.length,{min:1,max:200,scope,idx})}${numeric('Wysokość tortu · cm','height',p.height,{min:.1,max:200,scope,idx})}${numeric('Przełożenia kremem','layers',p.layers,{min:1,max:30,step:1,scope,idx})}`;}
function heading(title,subtitle,actions=''){return `<div class="heading"><div><h1>${title}</h1><p>${subtitle}</p></div><div class="actions">${actions}</div></div>`;}
function render(){recompute();$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="brandmark">P.</span><strong>Pracownia<br>Tortów<small>RECEPTURY & WYCENY</small></strong></div><nav aria-label="Nawigacja główna">${navs.map(([k,n])=>`<button data-action="view" data-view="${k}" class="${view===k?'active':''}" ${view===k?'aria-current="page"':''}>${icon(k)}${n}</button>`).join('')}</nav><div class="sidebottom">Twoje receptury, Twoje ceny.<br>Dane zapisują się na tym urządzeniu.<button data-action="export">Pobierz kopię danych</button></div></aside><main class="main"><div class="topline"><span>Moja pracownia <span aria-hidden="true">/</span> ${navs.find(x=>x[0]===view)[1]}</span><span class="badge" id="save-state">${saveError?'Sprawdź zapis danych':'Zapis na tym urządzeniu'}</span></div><div id="save-notice">${saveError?`<div class="error spaced">${esc(saveError)}</div>`:''}</div>${error?`<div class="error spaced" role="alert">${esc(error)} Popraw parametry kalkulacji.</div>`:''}${({sales:()=>salesUI.render(),calculator:calculatorView,recipes:recipesView,ingredients:ingredientsView,pricing:pricingView,quotes:quotesView,help:helpView})[view]()}</main></div><section class="printonly" id="print-content"></section>`;updateSaveBadge();}
function metrics(){if(!result)return '';return `<div class="metrics"><div class="metric featured"><span class="label">Cena sprzedaży · całe zamówienie</span><strong>${money(result.sale)}</strong><span class="muted">${money(result.perCake)} / tort</span></div><div class="metric"><span class="label">Pełny koszt</span><strong>${money(result.total)}</strong><span class="muted">Surowce, praca i pozostałe koszty</span></div><div class="metric"><span class="label">Zysk kalkulacyjny</span><strong class="${result.profit<0?'negative':'positive'}">${money(result.profit)}</strong><span class="muted">Marża ${result.actualMargin===null?'—':fmt(result.actualMargin)+'%'} · przed podatkami</span></div><div class="metric"><span class="label">Szacowane porcje</span><strong>~${result.portions}</strong><span class="muted">${money(result.perPortion)} / porcję</span></div></div>`;}
function calculatorView(){const o=state.order;return heading('Każdy tort dobrze policzony.','Dobierz formę, przelicz recepturę i przygotuj wycenę.',`<button data-action="print-production">Karta produkcji</button><button data-action="save-quote">Zapisz wycenę</button><button class="primary" data-action="sales-from-calculator">Utwórz zamówienie</button>`)+metrics()+`<div class="layout"><div class="stack"><section class="card"><div class="cardheader"><h2><span class="sectionnum">01</span> Twój tort</h2><span class="pill">${o.tiers.length} ${o.tiers.length===1?'piętro':'pięter'}</span></div><div class="body"><div class="fields two"><label>Nazwa zamówienia<input data-scope="order" data-key="name" value="${esc(o.name)}" maxlength="150"></label>${numeric('Liczba identycznych tortów','count',o.count,{min:1,max:1000,step:1})}</div><div class="spaced">${o.tiers.map((t,idx)=>`<div class="tier"><div class="tierhead"><h3>Piętro ${idx+1}</h3>${o.tiers.length>1?`<button class="small danger" data-action="remove-tier" data-index="${idx}">Usuń piętro</button>`:''}</div><div class="fields">${select('Receptura','recipeId',t.recipeId,state.recipes.map(r=>[r.id,r.name]),'tier',idx)}${geometryFields(t,'tier',idx)}</div>${tierNote(t,idx)}</div>`).join('')}</div><button class="small spaced" data-action="add-tier">+ Dodaj piętro</button><details><summary>Jak dobrać wysokość i przełożenia?</summary><p class="help">Wysokość to cały gotowy tort. Biszkopt skaluje się według proporcji objętości przy założeniu stałego udziału biszkoptu w torcie. Krem liczymy według powierzchni i liczby przełożeń, zakładając tę samą grubość każdej warstwy. Tynk — według wierzchu i boków, bez spodu. Każdą pozycję możesz skonfigurować w recepturze.</p></details></div></section><section class="card"><div class="cardheader"><h2><span class="sectionnum">02</span> Składniki do przygotowania</h2><button class="small" data-action="csv">Pobierz CSV</button></div><div class="tabs" role="group" aria-label="Widok składników">${[['recipe','Według receptury'],['shopping','Lista zakupów']].map(([k,v])=>`<button data-action="tab" data-tab="${k}" class="${tab===k?'active':''}" aria-pressed="${tab===k}">${v}</button>`).join('')}</div>${result?(tab==='recipe'?recipeTable():shoppingTable()):'<p class="empty">Popraw parametry, aby przeliczyć składniki.</p>'}</section><section class="card"><div class="cardheader"><h2><span class="sectionnum">03</span> Praca i koszty</h2><span class="muted">PLN</span></div><div class="body"><p class="help" style="margin-top:0">Wartości na jeden tort. Koszt dostawy dotyczy całego zamówienia.</p><div class="fields">${numeric('Czas pracy · godz.','hours',o.hours)}${numeric('Stawka · zł / godz.','rate',o.rate)}${numeric('Opakowanie i podkład · zł','packaging',o.packaging)}${numeric('Dekoracje dodatkowe · zł','decoration',o.decoration)}${numeric('Energia · kWh','energyKwh',o.energyKwh)}${numeric('Cena energii · zł / kWh','energyPrice',o.energyPrice)}${numeric('Pozostałe koszty · zł / tort','overhead',o.overhead)}${numeric('Dostawa · całe zamówienie · zł','delivery',o.delivery)}${numeric('Zapas technologiczny · %','reserve',o.reserve,{max:100})}</div><p class="help">Pozostałe koszty: np. woda, środki czystości, zużycie sprzętu i udział w kosztach pracowni. Nie doliczaj drugi raz dekoracji, które są już w recepturze. Zapas technologiczny zwiększa pozycje wagowe i objętościowe. Składniki w sztukach, np. jaja, są skalowane i zaokrąglane w górę do pełnej sztuki, bez doliczania procentowego zapasu. Pozycje „Stała ilość na piętro”, np. topper, również nie są zwiększane o zapas.</p></div></section></div><div class="stack">${costCard()}<section class="card"><div class="cardheader"><h2>Ustawienia wyceny</h2></div><div class="body"><div class="fields two">${numeric('Docelowa marża · %','margin',o.margin,{max:95})}${numeric('Zaokrąglij w górę · zł','roundTo',o.roundTo,{min:.01,max:1000})}${numeric('Objętość porcji · cm³','portionVolume',o.portionVolume,{min:10,max:2000})}<label>Własna cena łączna · zł<input type="number" min="0" step="any" data-scope="order" data-key="sale" value="${o.sale??''}" placeholder="Automatycznie"></label></div><p class="help">Marża 30% oznacza: cena = koszt ÷ 0,70. To nie jest narzut 30%. Pusta własna cena przywraca kalkulację automatyczną.</p>${result?`<div class="note">Cena sugerowana: <strong>${money(result.suggested)}</strong><br>Porcje są szacunkiem geometrycznym, zależnym od sposobu krojenia. Zmiana wielkości porcji nie zmienia ilości składników.</div>`:''}<button class="full spaced" data-action="print-quote">Drukuj ofertę / zapisz PDF</button></div></section><div class="note">Dane startowe są przykładowe. Przed pierwszą wyceną wpisz własne ceny zakupu i sprawdzone receptury.</div></div></div>`;}
function tierNote(t,idx){const r=state.recipes.find(r=>r.id===t.recipeId);if(!r)return '';let text='';try{text=`Przelicznik objętości: ×${fmt(scale('volume',r.base,t),3)}`;}catch(e){}return `<p class="help">Wzór: ${esc(r.name)}, ${shapeText(r.base)}, wys. ${fmt(r.base.height)} cm, ${r.base.layers} przełożenia.<br>${text}${result?` · około ${result.tiers[idx].portionEstimate} porcji / piętro`:''}</p>`;}
const costLabels={ingredients:'Składniki ze stratami',labor:'Praca',packaging:'Opakowanie i podkład',decoration:'Dekoracje dodatkowe',energy:'Energia',overhead:'Pozostałe koszty',delivery:'Dostawa'};
function costCard(){if(!result)return '';const colors=['#653351','#ae709a','#cfabc4','#cab9a9','#82a396','#a6b4ca','#d8bf7b'];return `<section class="card"><div class="cardheader"><h2>Skąd bierze się cena?</h2></div><div class="body">${Object.entries(result.costs).map(([k,v])=>`<div class="costline"><span>${costLabels[k]}</span><span>${money(v)}</span></div>`).join('')}<div class="bar" aria-hidden="true">${Object.values(result.costs).map((v,i)=>`<span style="width:${result.total?v/result.total*100:0}%;background:${colors[i]}"></span>`).join('')}</div><div class="costline total"><span>Pełny koszt</span><span>${money(result.total)}</span></div><div class="costline"><span>Zysk kalkulacyjny</span><span class="${result.profit<0?'negative':'positive'}">${money(result.profit)}</span></div>${result.profit<0?'<div class="error">Cena sprzedaży nie pokrywa kosztów zamówienia.</div>':''}<p class="help">Zysk po uwzględnieniu zadeklarowanych kosztów, przed podatkami. Wszystkie ceny wpisuj na tej samej podstawie: brutto albo netto.</p></div></section>`;}
function recipeTable(){return `<div class="tablewrap"><table><thead><tr><th>Składnik / sekcja</th><th class="num">Przelicznik</th><th class="num">Do receptury</th><th class="num">Koszt</th></tr></thead><tbody>${result.rows.map(r=>`<tr><td><span class="itemname">${esc(r.name)}</span><span class="itemmeta">Piętro ${r.tier} · ${esc(r.group)} · ${esc(MODES[r.mode])}</span></td><td class="num">×${fmt(r.factor,3)}</td><td class="num">${qty(r.net,r.unit)} ${r.unit}</td><td class="num">${money(r.cost)}</td></tr>`).join('')}</tbody></table></div><div class="body"><p class="help" style="margin:0">Ilości dla ${state.order.count} tortów, już z zapasem ${fmt(state.order.reserve)}%. Koszt uwzględnia dodatkowo straty poszczególnych składników. Składniki wagowe i objętościowe zachowują pełną precyzję. Składniki w sztukach są zaokrąglane w górę do pełnej sztuki dla każdego piętra.</p>${result.allergens.length?`<p class="help"><strong>Alergeny z bazy:</strong> ${esc(result.allergens.join('; '))}. Zweryfikuj etykiety wszystkich produktów i ryzyko kontaktu krzyżowego.</p>`:''}</div>`;}
function shoppingTable(){return `<div class="tablewrap"><table><thead><tr><th>Składnik</th><th class="num">Potrzeba brutto</th><th class="num">Zapas</th><th class="num">Kup opak.</th><th class="num">Wydatek</th></tr></thead><tbody>${result.shopping.map(r=>`<tr><td><span class="itemname">${esc(r.name)}</span><span class="itemmeta">Opakowanie ${qty(r.packBase,r.unit)} ${r.unit} · po produkcji ${qty(r.leftover,r.unit)} ${r.unit}</span></td><td class="num">${qty(r.gross,r.unit)} ${r.unit}</td><td class="num">${qty(r.stock,r.unit)} ${r.unit}</td><td class="num">${r.packs}</td><td class="num">${money(r.buyCost)}</td></tr>`).join('')}</tbody></table></div><div class="body"><div class="costline total"><span>Zakup pełnych opakowań</span><span>${money(result.shoppingCost)}</span></div><p class="help">Potrzeba brutto uwzględnia zapas technologiczny i straty. Dla sztuk pokazuje wyłącznie liczby całkowite. Zakupy pomniejszamy o wpisany stan magazynowy. Koszt tortu obejmuje zużytą część opakowania, także ze składników posiadanych. Zapis wyceny nie pomniejsza magazynu.</p></div>`;}
function ingredientsView(){const list=state.ingredients.filter(i=>i.name.toLocaleLowerCase('pl').includes(search.toLocaleLowerCase('pl')));return heading('Składniki i ceny','Jedna baza cen dla wszystkich Twoich receptur.',`<button class="primary" data-action="new-ingredient">+ Nowy składnik</button>`)+`<section class="card"><div class="cardheader"><input class="search" id="ingredient-search" type="search" value="${esc(search)}" placeholder="Szukaj składnika…" aria-label="Szukaj składnika"><span class="muted">${state.ingredients.length} składników</span></div><div class="tablewrap"><table><thead><tr><th>Składnik</th><th class="num">Opakowanie</th><th class="num">Cena</th><th class="num">Cena jednostkowa</th><th class="num">Strata</th><th class="num">Magazyn</th><th>Akcje</th></tr></thead><tbody>${list.map(i=>`<tr><td><span class="itemname">${esc(i.name)}</span><span class="itemmeta">${esc(i.supplier)}</span>${i.allergens?`<span class="itemmeta">Alergeny: ${esc(i.allergens)}</span>`:''}</td><td class="num">${qty(i.pack,i.unit)} ${i.unit}</td><td class="num">${money(i.price)}</td><td class="num">${money(i.price/(i.pack*UNITS[i.unit].factor)*(i.unit==='szt'?1:1000))} / ${i.unit==='szt'?'szt.':UNITS[i.unit].base==='g'?'kg':'l'}</td><td class="num">${fmt(i.loss)}%</td><td class="num">${qty(i.stock,i.unit)} ${i.unit}</td><td><div class="actions"><button class="small" data-action="edit-ingredient" data-id="${esc(i.id)}">Edytuj</button><button class="small danger" data-action="delete-ingredient" data-id="${esc(i.id)}" aria-label="Usuń ${esc(i.name)}">Usuń</button></div></td></tr>`).join('')}</tbody></table>${!list.length?'<div class="empty">Brak pasujących składników.</div>':''}</div></section><div class="note spaced">Strata określa część zakupionej ilości, której nie wykorzystasz, np. odpad po obraniu owoców. Przy stracie 10% na 100 g produktu jadalnego potrzeba 111,11 g zakupionego produktu. Magazyn wpisuj w jednostce opakowania.</div>`;}
function recipesView(){return heading('Twoje receptury','Zapisz sprawdzony wzór. Dopasuj go do kolejnego tortu.',`<button class="primary" data-action="new-recipe">+ Nowa receptura</button>`)+`<div class="recipegrid">${state.recipes.map(r=>{let c;try{c=calculate(state.ingredients,state.recipes,{...state.order,tiers:[{...r.base,recipeId:r.id}],count:1,reserve:0}).costs.ingredients;}catch(e){c=0;}return `<article class="card"><div class="recipecover"><small>Receptura bazowa</small><h2>${esc(r.name)}</h2></div><div class="body"><div class="actions"><span class="pill">${shapeText(r.base)}</span><span class="pill">wys. ${fmt(r.base.height)} cm</span><span class="pill">${r.base.layers} przełożenia</span></div><p class="help">${r.rows.length} pozycji · surowce <strong>${money(c)}</strong><br>Koszt wzoru ze stratami składników, bez zapasu technologicznego.</p><div class="actions"><button class="primary small" data-action="use-recipe" data-id="${esc(r.id)}">Przelicz tort</button><button class="small" data-action="edit-recipe" data-id="${esc(r.id)}">Edytuj</button><button class="small" data-action="clone-recipe" data-id="${esc(r.id)}">Duplikuj</button><button class="small danger" data-action="delete-recipe" data-id="${esc(r.id)}">Usuń</button></div><details><summary>Przygotowanie i notatki</summary><p class="help" style="white-space:pre-wrap">${esc(r.notes)||'Brak notatek.'}</p></details></div></article>`;}).join('')}</div><div class="note spaced">Przypisz sposób skalowania każdej pozycji: objętość biszkoptu, powierzchnia i liczba przełożeń kremu, powierzchnia tynku, sama powierzchnia, obwód lub stała ilość. Wzór może być okrągły albo prostokątny.</div>`;}
function pricingView(){const o=state.order,t=o.tiers[0],sizes=[14,16,18,20,22,24,26,28,30,32];return heading('Cennik z Twoich kosztów','Porównaj średnice i wybierz opłacalną cenę.',`<button data-action="print-pricing">Drukuj cennik</button>`)+`<section class="card"><div class="body"><div class="fields">${select('Receptura','recipeId',t.recipeId,state.recipes.map(r=>[r.id,r.name]),'tier',0)}${numeric('Wysokość · cm','height',t.height,{scope:'tier',idx:0,min:.1,max:200})}${numeric('Przełożenia kremem','layers',t.layers,{scope:'tier',idx:0,min:1,max:30,step:1})}</div><p class="help">Zmiany aktualizują pierwsze piętro kalkulatora. Poniżej: pojedynczy tort, jedno okrągłe piętro, koszt dostawy ${money(o.delivery)}, czas pracy ${fmt(o.hours)} godz. i pozostałe ustawienia kalkulatora. Własna cena sprzedaży jest pomijana.</p></div>${pricingTable(sizes)}</section><div class="note spaced">To kalkulowany cennik bazowy, nie badanie cen lokalnego rynku. Czas pracy i dekoracje pozostają takie same dla każdej średnicy — dostosuj je w indywidualnej wycenie. Porcje są orientacyjne.</div>`;}
function pricingTable(sizes){return `<div class="tablewrap"><table><thead><tr><th>Średnica</th><th class="num">Porcje ~</th><th class="num">Surowce</th><th class="num">Pełny koszt</th><th class="num">Cena sugerowana</th><th class="num">Cena / porcję</th><th class="noprint">Wybierz</th></tr></thead><tbody>${sizes.map(d=>{try{const r=calculate(state.ingredients,state.recipes,{...state.order,count:1,sale:null,tiers:[{...state.order.tiers[0],shape:'round',diameter:d}]});return `<tr><td class="itemname">Ø ${d} cm</td><td class="num">${r.portions}</td><td class="num">${money(r.costs.ingredients)}</td><td class="num">${money(r.total)}</td><td class="num itemname">${money(r.suggested)}</td><td class="num">${money(r.perPortion)}</td><td class="noprint"><button class="small" data-action="choose-size" data-size="${d}">Wyceń</button></td></tr>`;}catch(e){return `<tr><td colspan="7">${esc(e.message)}</td></tr>`;}}).join('')}</tbody></table></div>`;}
function quotesView(){return heading('Zapisane wyceny','Archiwum receptur, cen i parametrów z chwili zapisu.')+`<section class="card">${state.quotes.length?state.quotes.slice().reverse().map(q=>{const r=calculate(q.snapshot.ingredients,q.snapshot.recipes,q.snapshot.order);return `<div class="quote"><div><h2>${esc(q.name)}</h2><p class="help" style="margin:7px 0 0">${new Date(q.date).toLocaleString('pl-PL')} · ${q.snapshot.order.count} tortów · około ${r.portions} porcji<br>Archiwalna cena: <strong>${money(r.sale)}</strong> · koszt ${money(r.total)}</p></div><div class="actions"><button class="small" data-action="open-quote" data-id="${esc(q.id)}">Podgląd</button><button class="small" data-action="restore-quote" data-id="${esc(q.id)}">Wczytaj do pracy</button><button class="small danger" data-action="delete-quote" data-id="${esc(q.id)}">Usuń</button></div></div>`;}).join(''):'<div class="empty"><h2>Jeszcze bez zapisanych wycen</h2><p>Przygotuj tort w kalkulatorze i wybierz „Zapisz wycenę”.</p><button data-action="view" data-view="calculator">Przejdź do kalkulatora</button></div>'}</section>`;}
function helpView(){return heading('Dane i pomoc','Twoje przepisy zostają pod Twoją kontrolą.')+`<div class="stack helpcontent"><section class="card"><div class="cardheader"><h2>Kopia danych</h2></div><div class="body"><p style="margin-top:0">Aplikacja zapisuje składniki, receptury, wyceny, zamówienia i zdjęcia w bazie tej przeglądarki. Pełna kopia JSON zawiera także zdjęcia i dane klientów. Dane nie synchronizują się między telefonem i komputerem. Przeniesiesz je za pomocą pliku JSON.</p><div class="actions"><button class="primary" data-action="export">Pobierz kopię JSON</button><button data-action="import">Wczytaj kopię JSON</button>${backupBlocked?'<button data-action="export-raw">Pobierz oryginalny zapis</button><button data-action="unlock-storage">Zastąp uszkodzony zapis</button>':''}</div><p class="help">Import zastępuje całą bieżącą bazę, w tym zamówienia i zdjęcia, po sprawdzeniu pliku i potwierdzeniu. Stara kopia bez zamówień wczyta pustą listę zamówień. Czyść dane przeglądarki dopiero po zapisaniu kopii. Na GitHub Pages dostępny jest kod aplikacji i dane demonstracyjne; Twoje lokalne wpisy nie są automatycznie publikowane.</p></div></section><section class="card"><div class="body"><h2 style="margin-top:0">Od pierwszego składnika do oferty</h2><ol><li><strong>Składniki i ceny:</strong> wpisz cenę i wielkość opakowania, jednostkę, straty oraz ewentualny stan magazynu.</li><li><strong>Receptury:</strong> utwórz wzór dla określonej średnicy lub blachy, wysokości gotowego tortu i liczby przełożeń. Wpisz dokładne ilości oraz sposób skalowania każdej pozycji.</li><li><strong>Kalkulator:</strong> dobierz formę docelową, dodaj piętra, ustaw liczbę identycznych tortów i zapas technologiczny.</li><li><strong>Koszty:</strong> uwzględnij pracę, opakowanie, energię i pozostałe wydatki. Ustaw marżę i zweryfikuj sugerowaną cenę.</li><li><strong>Produkcja i sprzedaż:</strong> pobierz listę CSV, wydrukuj kartę produkcji albo ofertę bez ujawniania kosztów. Wyceny zapisują niezmienną kopię ówczesnych danych.</li></ol><h2>Sprzedaż i zamówienia</h2><p>Dodaj zamówienie ręcznie albo z kalkulatora. Zapisz klienta, termin, status, opis, smak, kolorystykę i napis. Dołącz do 8 zdjęć JPEG, PNG lub WebP i opisz wybrane elementy inspiracji. Zdjęcia są zmniejszane do maksymalnie 1400 pikseli i przechowywane jako kopie poglądowe. Otrzymaną zaliczkę i pozostałe wpłaty wpisuj oddzielnie; status wydania nie zmienia wpłat. Powiązana wycena jest niezależną kopią: edycja receptur lub usunięcie archiwalnej wyceny jej nie zmienia. Karta zamówienia zawiera także wewnętrzne notatki i jest dokumentem roboczym.</p><h2>Silnik obliczeń</h2><ul><li>Koło: pole = π × (średnica / 2)². Prostokąt: pole = szerokość × długość.</li><li>Biszkopt: mnożnik = objętość docelowa / objętość wzoru. Wysokość odnosi się do gotowego tortu — to model przy stałym udziale biszkoptu.</li><li>Krem: mnożnik = stosunek pól × stosunek liczby przełożeń. Nie dodajemy ponownie mnożnika wysokości.</li><li>Tynk: mnożnik = stosunek powierzchni (wierzch + obwód × wysokość). Spód nie jest tynkowany.</li><li>Dla g, kg, ml i l: ilość = wzór × mnożnik × liczba tortów × (1 + zapas / 100). Dla sztuk: wynik bez zapasu procentowego, zaokrąglony w górę.</li><li>Ilość zakupiona do zużycia = ilość do receptury / (1 − strata / 100). Koszt = ta ilość / zawartość opakowania × cena opakowania.</li><li>Cena = pełny koszt / (1 − marża / 100), zaokrąglona w górę do wybranego kroku. Zysk = cena − pełny koszt.</li></ul><h2>Jednostki i dokładność</h2><p>Obsługujemy g, kg, ml, l i sztuki. Masa i objętość nie są zamieniane automatycznie. Śmietankę zakupioną w ml zapisuj w recepturze w ml lub l. Jeśli ważysz ją w gramach, utwórz pozycję zakupową o ustalonej masie netto. Jaja i inne produkty kupowane na sztuki zapisuj jako „szt.”. Wielkość opakowania, stan magazynu i ilość bazowa muszą być całkowite.</p><p>Po przeliczeniu formy każda pozycja w sztukach jest zaokrąglana w górę osobno dla danego piętra. Procentowego zapasu nie doliczamy do sztuk, ponieważ samo zaokrąglenie daje pełną sztukę. Stała dekoracja pozostaje dokładnie w ilości bazowej. Lista zakupów zaokrągla liczbę pełnych opakowań w górę. Suma widocznych, zaokrąglonych pozycji może różnić się o kilka groszy od sumy liczonej z pełną precyzją.</p><h2>Założenia, które warto znać</h2><p>Przeliczenie składników nie wyznacza automatycznie temperatury, czasu pieczenia ani wytrzymałości konstrukcji tortu. Każde piętro liczymy jako osobny tort z tynkowanym wierzchem i bokami. Ustawienia porcji to szacunek objętości, nie waga tortu ani gwarantowana liczba kawałków. Własną porcję możesz wyznaczyć jako szerokość × głębokość × wysokość kawałka.</p><p>Ceny startowe i receptury są demonstracyjne. Kalkulacja nie oblicza VAT, podatku dochodowego ani składek. Nie mieszaj kosztów netto z brutto. Pole alergenów jest Twoją ewidencją, a nie automatyczną oceną bezpieczeństwa produktu.</p><h2>Źródła i inspiracje</h2><p>Sprawdzone 6–7 września 2026 r. Źródła posłużyły do doboru funkcji i zasad przeliczania; aplikacja ma własny kod i silnik.</p><ul><li><a href="https://sallysbakingaddiction.com/cake-pan-sizes/" target="_blank" rel="noopener noreferrer">Sally’s Baking Addiction — rozmiary i pojemności form</a></li><li><a href="https://www.bakevert.com/english" target="_blank" rel="noopener noreferrer">Bakevert — przeliczanie form okrągłych i prostokątnych</a></li><li><a href="https://www.cakecost.net/" target="_blank" rel="noopener noreferrer">CakeCost — składniki, czas pracy i koszty w wycenie</a></li><li><a href="https://www.thecakebusinessclub.co.uk/calculator" target="_blank" rel="noopener noreferrer">The Cake Business Club — kalkulator wyceny tortów</a></li></ul></div></section></div>`;}
function showDialog(html){const dialog=$('#editor');dialog.innerHTML=html;if(!dialog.open)dialog.showModal();}
function dialogShell(title,body,footer='<button type="button" data-action="close-dialog">Anuluj</button><button class="primary" type="submit">Zapisz</button>'){return `<form id="editor-form"><div class="cardheader"><h2>${title}</h2><button type="button" class="icon" data-action="close-dialog" aria-label="Zamknij">×</button></div><div class="body"><div id="dialog-error" role="alert"></div>${body}</div><footer>${footer}</footer></form>`;}
function showIngredient(id){draft={type:'ingredient',data:id?clone(state.ingredients.find(i=>i.id===id)):{id:uid(),name:'',unit:'g',pack:1000,price:0,loss:0,stock:0,allergens:'',supplier:''},existing:!!id};const i=draft.data;showDialog(dialogShell(id?'Edytuj składnik':'Nowy składnik',`<div class="fields two"><label class="wide">Nazwa<input name="name" value="${esc(i.name)}" maxlength="150" required></label>${numeric('Wielkość opakowania','pack',i.pack,{min:i.unit==='szt'?1:.001,step:i.unit==='szt'?1:'any',scope:'ingredient'})}${select('Jednostka opakowania','unit',i.unit,Object.keys(UNITS).map(u=>[u,u]),'ingredient')}${numeric('Cena opakowania · zł','price',i.price,{scope:'ingredient'})}${numeric('Strata · %','loss',i.loss,{max:95,scope:'ingredient'})}${numeric('Stan magazynu · jednostka opakowania','stock',i.stock,{step:i.unit==='szt'?1:'any',scope:'ingredient'})}<label>Dostawca / uwaga o cenie<input name="supplier" value="${esc(i.supplier)}" maxlength="200"></label><label class="wide">Alergeny — według etykiety<input name="allergens" value="${esc(i.allergens)}" maxlength="300" placeholder="np. mleko, jaja, pszenica (gluten)"></label></div><p class="help">Stan magazynu podaj w wybranej jednostce, nie w liczbie opakowań. Po zmianie jednostki wpisz odpowiadające jej wielkość opakowania i zapas. Nie można zmienić masy na objętość składnika użytego w recepturze.</p>`));}
function recipeRowsEditor(){return draft.data.rows.map((r,idx)=>`<div class="recipe-row" data-row="${idx}">${select('Składnik','ingredientId',r.ingredientId,state.ingredients.map(i=>[i.id,i.name]),'recipe-row',idx)}${numeric('Ilość bazowa','qty',r.qty,{min:r.unit==='szt'?1:.001,step:r.unit==='szt'?1:'any',scope:'recipe-row',idx})}${select('Jednostka','unit',r.unit,Object.keys(UNITS).filter(u=>UNITS[u].dimension===UNITS[state.ingredients.find(i=>i.id===r.ingredientId).unit].dimension).map(u=>[u,u]),'recipe-row',idx)}<label>Sekcja<input data-scope="recipe-row" data-key="group" data-idx="${idx}" value="${esc(r.group)}" maxlength="80" placeholder="np. Krem"></label>${select('Skalowanie','mode',r.mode,Object.entries(MODES),'recipe-row',idx)}<button class="icon danger" type="button" data-action="remove-recipe-row" data-index="${idx}" aria-label="Usuń pozycję ${idx+1}">×</button></div>`).join('');}
function showRecipe(id,duplicate=false){const base={shape:'round',diameter:20,width:20,length:30,height:12,layers:2};const data=id?clone(state.recipes.find(r=>r.id===id)):{id:uid(),name:'',base,rows:[],notes:''};if(duplicate){data.id=uid();data.name+=' — kopia';}draft={type:'recipe',data,existing:!!id&&!duplicate};renderRecipeDialog();}
function renderRecipeDialog(){const r=draft.data;showDialog(dialogShell(draft.existing?'Edytuj recepturę':'Nowa receptura',`<div class="fields two"><label class="wide">Nazwa receptury<input data-scope="recipe" data-key="name" value="${esc(r.name)}" maxlength="150" required></label></div><h3 class="spaced">Forma i tort bazowy</h3><div class="fields spaced">${geometryFields(r.base,'recipe-base')}</div><p class="help">Wpisz rozmiar gotowego tortu, dla którego znasz ilości bazowe. Liczba przełożeń dotyczy warstw kremu.</p><h3 class="spaced">Składniki wzoru</h3><div id="recipe-rows">${recipeRowsEditor()}</div><button type="button" data-action="add-recipe-row" class="small">+ Dodaj składnik</button><label class="spaced">Przygotowanie i notatki<textarea data-scope="recipe" data-key="notes" maxlength="12000">${esc(r.notes)}</textarea></label>`));}
function confirmAction(title,message,fn){draft={type:'confirm',fn};showDialog(dialogShell(esc(title),`<p>${esc(message)}</p>`,'<button type="button" data-action="close-dialog">Anuluj</button><button type="submit" class="primary">Potwierdź</button>'));}
function download(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportData(){download(`pracownia-tortow-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(state,null,2));toast('Pobrano kopię danych.');}
function needResult(){if(!result){toast('Najpierw popraw parametry kalkulacji.');return false;}return true;}
async function saveQuote(){if(!needResult())return;if(state.quotes.length>=500){toast('Archiwum mieści 500 wycen. Wyeksportuj kopię i usuń niepotrzebne wpisy.');return;}const snapshot=clone({...state,quotes:[],sales:[]});state.quotes.push({id:uid(),date:new Date().toISOString(),name:state.order.name||'Wycena tortu',snapshot});if(!await persist())return;render();toast('Zapisano wycenę razem z recepturami i cenami.');}
function csv(){if(!needResult())return;const quote=s=>{s=String(s);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const rows=[['Składnik','Jednostka','Do receptury','Potrzeba brutto','Zapas','Brakuje','Opakowania do kupienia','Wydatek PLN','Koszt zużycia PLN'],...result.shopping.map(r=>[r.name,r.unit,r.net.toFixed(3),r.gross.toFixed(3),r.stock.toFixed(3),r.missing.toFixed(3),r.packs,r.buyCost.toFixed(2),r.cost.toFixed(2)])];download('lista-zakupow.csv','\uFEFF'+rows.map(r=>r.map(quote).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
function printDocument(type,snapshot=state){const r=calculate(snapshot.ingredients,snapshot.recipes,snapshot.order),o=snapshot.order;const common=`<h1>Pracownia Tortów</h1><h2>${esc(o.name||'Wycena tortu')}</h2><p>${new Date().toLocaleDateString('pl-PL')} · ${o.count} tortów · ${o.tiers.map((t,idx)=>`Piętro ${idx+1}: ${esc(snapshot.recipes.find(x=>x.id===t.recipeId).name)}, ${shapeText(t)}, wys. ${fmt(t.height)} cm`).join(' · ')}</p>`;let body;if(type==='quote'){body=common+`<h2>Oferta</h2><div class="printsummary"><div>Cena zamówienia<br><strong>${money(r.sale)}</strong></div><div>Cena za tort<br><strong>${money(r.perCake)}</strong></div><div>Orientacyjna liczba porcji<br><strong>${r.portions}</strong></div></div><p>W kalkulacji uwzględniono dekoracje, opakowanie oraz dostawę w zakresie ustalonym indywidualnie. Sposób dekoracji, termin i miejsce odbioru wymagają uzgodnienia. Liczba porcji zależy od sposobu krojenia.</p><p><strong>Alergeny według wpisów w bazie:</strong> ${esc(r.allergens.join('; '))||'Nie wpisano — do ustalenia.'}. Wymagają weryfikacji etykiet i warunków przygotowania.</p>`;}else if(type==='production'){body=common+`<h2>Karta produkcji</h2><p>Zapas technologiczny ${fmt(o.reserve)}%, ilości poniżej dla całego zamówienia. Straty zakupowe nie są częścią ilości do odważenia.</p><table><thead><tr><th>Piętro</th><th>Sekcja</th><th>Składnik</th><th>Ilość do receptury</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>${x.tier}</td><td>${esc(x.group)}</td><td>${esc(x.name)}</td><td>${qty(x.net,x.unit)} ${x.unit}</td></tr>`).join('')}</tbody></table><h2>Zakupy</h2><table><thead><tr><th>Składnik</th><th>Potrzeba brutto</th><th>Zapas</th><th>Kup opakowań</th></tr></thead><tbody>${r.shopping.map(x=>`<tr><td>${esc(x.name)}</td><td>${qty(x.gross,x.unit)} ${x.unit}</td><td>${qty(x.stock,x.unit)} ${x.unit}</td><td>${x.packs}</td></tr>`).join('')}</tbody></table>${o.tiers.map((t,idx)=>`<h2>Piętro ${idx+1} — przygotowanie</h2><p style="white-space:pre-wrap">${esc(snapshot.recipes.find(x=>x.id===t.recipeId).notes)}</p>`).join('')}<p><strong>Alergeny do weryfikacji:</strong> ${esc(r.allergens.join('; '))||'Nie wpisano.'}</p>`;}else{const t=o.tiers[0];body=`<h1>Pracownia Tortów — cennik</h1><p>${esc(snapshot.recipes.find(x=>x.id===t.recipeId).name)} · wys. ${fmt(t.height)} cm · ${t.layers} przełożenia · ${new Date().toLocaleDateString('pl-PL')}</p>`+pricingTable([14,16,18,20,22,24,26,28,30,32])+`<p>Cennik roboczy według kosztów pracowni. Jedno okrągłe piętro, jeden tort. Porcje orientacyjne. Dekoracje i czas pracy według ustawień kalkulatora.</p>`;}$('#print-content').innerHTML=body;window.print();}
// Prevent a blur-triggered re-render from swallowing a pointer click on an action.
$('#app').addEventListener('pointerdown',e=>{if(e.target.closest('[data-action]')&&document.activeElement?.matches('#app input[data-scope]'))e.preventDefault();});
$('#app').addEventListener('click',handleAction);$('#editor').addEventListener('click',handleAction);
function handleAction(e){const b=e.target.closest('[data-action]');if(!b)return;const active=document.activeElement;if(active?.matches('#app input[data-scope]')){if(!active.checkValidity()){active.reportValidity();return;}active.blur();}const a=b.dataset.action,id=b.dataset.id,idx=Number(b.dataset.index);try{if(a.startsWith('sales-')){salesUI.handle(b).catch(e=>toast(e.message));return;}switch(a){case 'view':view=b.dataset.view;render();break;case 'tab':tab=b.dataset.tab;render();break;case 'add-tier':if(state.order.tiers.length>=20)return toast('Maksymalnie 20 pięter.');state.order.tiers.push({...state.order.tiers.at(-1),diameter:Math.max(10,state.order.tiers.at(-1).diameter-4)});persist();render();break;case 'remove-tier':state.order.tiers.splice(idx,1);persist();render();break;case 'new-ingredient':showIngredient();break;case 'edit-ingredient':showIngredient(id);break;case 'delete-ingredient':if(state.recipes.some(r=>r.rows.some(x=>x.ingredientId===id)))return toast('Składnik jest używany w recepturze. Najpierw usuń go z receptur.');confirmAction('Usunąć składnik?','Zapisane wyceny zachowają jego archiwalną kopię.',()=>{state.ingredients=state.ingredients.filter(i=>i.id!==id);persist();render();});break;case 'new-recipe':if(!state.ingredients.length)return toast('Najpierw dodaj składnik.');showRecipe();break;case 'edit-recipe':showRecipe(id);break;case 'clone-recipe':showRecipe(id,true);break;case 'delete-recipe':if(state.order.tiers.some(t=>t.recipeId===id))return toast('Receptura jest używana w kalkulatorze. Najpierw wybierz inną.');confirmAction('Usunąć recepturę?','Zapisane wyceny pozostaną niezmienione.',()=>{state.recipes=state.recipes.filter(r=>r.id!==id);persist();render();});break;case 'use-recipe':confirmAction('Przeliczyć nowy tort?','Bieżące piętra zostaną zastąpione jednym piętrem według wybranej receptury. Pozostałe ustawienia kosztów pozostaną; własna cena zostanie wyczyszczona.',()=>{const r=state.recipes.find(r=>r.id===id);state.order.tiers=[{...r.base,recipeId:id}];state.order.sale=null;view='calculator';persist();render();});break;case 'choose-size':confirmAction('Wybrać tort z cennika?','Zastąpimy bieżące zamówienie jednym tortem z jednym piętrem o tej średnicy. Pozostałe koszty pozostaną, cena będzie automatyczna.',()=>{state.order.tiers=[{...state.order.tiers[0],shape:'round',diameter:Number(b.dataset.size)}];state.order.count=1;state.order.sale=null;view='calculator';persist();render();});break;case 'close-dialog':$('#editor').close();draft=null;break;case 'add-recipe-row':if(draft.data.rows.length>=300)return toast('Maksymalnie 300 pozycji.');draft.data.rows.push({ingredientId:state.ingredients[0].id,qty:100,unit:UNITS[state.ingredients[0].unit].base,group:'Biszkopt',mode:'volume'});$('#recipe-rows').innerHTML=recipeRowsEditor();break;case 'remove-recipe-row':draft.data.rows.splice(idx,1);$('#recipe-rows').innerHTML=recipeRowsEditor();break;case 'save-quote':saveQuote();break;case 'delete-quote':confirmAction('Usunąć wycenę?','Tej operacji nie można cofnąć bez kopii JSON.',()=>{state.quotes=state.quotes.filter(q=>q.id!==id);persist();render();});break;case 'open-quote':{const q=state.quotes.find(q=>q.id===id),r=calculate(q.snapshot.ingredients,q.snapshot.recipes,q.snapshot.order);showDialog(dialogShell(esc(q.name),`<p>Archiwum z ${new Date(q.date).toLocaleString('pl-PL')}.</p><div class="costline"><span>Pełny koszt</span><strong>${money(r.total)}</strong></div><div class="costline"><span>Cena</span><strong>${money(r.sale)}</strong></div><div class="costline"><span>Zysk kalkulacyjny</span><strong>${money(r.profit)}</strong></div><p class="help">${q.snapshot.order.tiers.map(t=>`${esc(q.snapshot.recipes.find(x=>x.id===t.recipeId).name)} · ${shapeText(t)}`).join('<br>')}</p>`,`<button type="button" data-action="close-dialog">Zamknij</button><button type="button" data-action="print-archive" data-id="${esc(id)}">Drukuj ofertę</button>`));break;}case 'restore-quote':confirmAction('Wczytać archiwalną wycenę?','Bieżący kalkulator oraz baza składników i receptur zostaną zastąpione danymi z tej wyceny. Archiwum wycen pozostanie. Pobierz wcześniej kopię JSON, jeśli chcesz zachować aktualne dane.',()=>{const q=state.quotes.find(q=>q.id===id);state={...clone(q.snapshot),quotes:state.quotes,sales:state.sales??[]};view='calculator';persist();render();});break;case 'export':exportData();break;case 'import':$('#import-file').click();break;case 'export-raw':download('pracownia-tortow-oryginalny-zapis.txt',storage.lastRaw?JSON.stringify(storage.lastRaw,null,2):legacyRaw,'text/plain');break;case 'unlock-storage':confirmAction('Zastąpić zapis?','Bieżące dane demonstracyjne lub wczytane zostaną zapisane zamiast poprzedniego zapisu. Najpierw pobierz oryginał, jeśli chcesz go zachować.',()=>{backupBlocked=false;persist();render();});break;case 'csv':csv();break;case 'print-quote':if(needResult())printDocument('quote');break;case 'print-production':if(needResult())printDocument('production');break;case 'print-pricing':if(needResult())printDocument('pricing');break;case 'print-archive':$('#editor').close();printDocument('quote',state.quotes.find(q=>q.id===id).snapshot);break;}}catch(e){toast(e.message);}}
$('#app').addEventListener('input',e=>{if(e.target.id==='ingredient-search'){search=e.target.value;const pos=e.target.selectionStart;render();const input=$('#ingredient-search');input.focus();input.setSelectionRange(pos,pos);}});
$('#app').addEventListener('change',e=>{const el=e.target,{scope,key,idx}=el.dataset;if(!scope)return;if(!el.checkValidity()){el.reportValidity();return;}const value=el.type==='number'?(el.value===''&&key==='sale'?null:Number(el.value)):el.value;const previous=clone(state.order);if(scope==='order')state.order[key]=value;else if(scope==='tier')state.order.tiers[Number(idx)][key]=value;try{calculate(state.ingredients,state.recipes,state.order);persist();render();}catch(e){state.order=previous;render();toast(e.message);}});
$('#editor').addEventListener('input',e=>{if(!draft||draft.type!=='recipe')return;const el=e.target,{scope,key,idx}=el.dataset;if(!scope)return;const value=el.type==='number'?Number(el.value):el.value;if(scope==='recipe')draft.data[key]=value;if(scope==='recipe-base')draft.data.base[key]=value;if(scope==='recipe-row')draft.data.rows[Number(idx)][key]=value;});
$('#editor').addEventListener('change',e=>{if(!draft||draft.type!=='recipe')return;const {scope,key,idx}=e.target.dataset;if(scope==='recipe-base'&&key==='shape'){draft.data.base.shape=e.target.value;renderRecipeDialog();}if(scope==='recipe-row'&&key==='ingredientId'){const row=draft.data.rows[Number(idx)];row.ingredientId=e.target.value;row.unit=UNITS[state.ingredients.find(i=>i.id===row.ingredientId).unit].base;$('#recipe-rows').innerHTML=recipeRowsEditor();}});
$('#editor').addEventListener('submit',async e=>{e.preventDefault();if(!draft)return;try{if(draft.type==='confirm'){const fn=draft.fn;$('#editor').close();draft=null;Promise.resolve(fn()).catch(e=>toast(e.message));return;}const candidate=clone(state);if(draft.type==='ingredient'){const f=$('#editor-form'),i={...draft.data};for(const key of ['name','supplier','allergens'])i[key]=f.elements[key].value.trim();for(const key of ['pack','price','loss','stock'])i[key]=Number(f.querySelector(`[data-key="${key}"]`).value);i.unit=f.querySelector('[data-key="unit"]').value;validateIngredient(i);if(draft.existing)candidate.ingredients=candidate.ingredients.map(x=>x.id===i.id?i:x);else candidate.ingredients.push(i);}else{const r=clone(draft.data);r.name=r.name.trim();validateRecipe(r,candidate.ingredients);if(draft.existing)candidate.recipes=candidate.recipes.map(x=>x.id===r.id?r:x);else candidate.recipes.push(r);}validateState(candidate);state=candidate;if(!await persist())return;$('#editor').close();draft=null;render();toast('Zapisano zmiany.');}catch(err){$('#dialog-error').innerHTML=`<div class="error">${esc(err.message)}</div>`;$('#dialog-error').scrollIntoView({block:'nearest'});}});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>100*1024*1024)throw Error('Maksymalny rozmiar kopii to 100 MB.');const migrated=migrateState(JSON.parse(await file.text()));const imported=validateState(migrated.state);confirmAction('Zastąpić dane kopią? ',`Plik zawiera ${imported.ingredients.length} składników, ${imported.recipes.length} receptur i ${imported.quotes.length} wycen oraz ${imported.sales.length} zamówień ze zdjęciami. Cała bieżąca baza zostanie zastąpiona.`,async()=>{await storage.load();backupBlocked=false;await commitState(clone(imported));view='sales';render();toast('Wczytano kopię danych wraz ze zdjęciami.');});}catch(err){toast('Nie wczytano pliku: '+err.message);}});
window.addEventListener('storage',e=>{if(e.key===SYNC_KEY){backupBlocked=true;saveError='Dane zmieniły się w innej karcie. Pobierz kopię bieżącej pracy i odśwież stronę, aby uniknąć nadpisania zmian.';render();}});
const salesUI=createSalesUI({getState:()=>state,commit:commitState,render,esc,money,fmt,uid,toast,download,printProduction:s=>printDocument('production',s)});
async function initialize(){
  $('#app').innerHTML='<div class="empty"><h1>Pracownia Tortów</h1><p>Wczytywanie Twojej pracowni…</p></div>';
  try{let saved=await storage.load(),newStore=!saved;if(!saved){try{legacyRaw=localStorage.getItem(KEY)||'';}catch(e){}saved=legacyRaw?JSON.parse(legacyRaw):initialState();}const migrated=migrateState(saved);state=validateState(migrated.state);if(newStore||migrated.changed)await storage.save(state);}
  catch(e){backupBlocked=true;saveError='Nie udało się wczytać danych: '+e.message+' Oryginalny zapis nie został zastąpiony. Pobierz go w sekcji Dane i pomoc. Zapis jest wstrzymany.';}
  render();
}
const ready=initialize();
window.addEventListener('beforeunload',e=>{if(saving||saveError){e.preventDefault();e.returnValue='';}});

</script></body></html>
