# Opcjonalny szablon; publikacja z gałęzi nie wymaga tego pliku.
name: Publikuj Pracownię Tortów
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sprawdź składnię
        run: |
          node --check app.js
          node --check engine.js
          node --check data.js
          node --check sales-ui.js
          node --check storage.js
          node --check cooking.js
          node --check demo-steps.js
      - name: Sprawdź obliczenia i widoki
        run: node --test *.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publikuj
        id: deployment
        uses: actions/deploy-pages@v4
